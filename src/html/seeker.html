<!doctype html>
<html lang="zh">
  <head>
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="seekerApp" class="seeker-shell">
      <section class="seeker-hero" aria-labelledby="seekerTitle">
        <div class="seeker-brand">
          <h1 id="seekerTitle">遍黑查形</h1>
          <p class="seeker-meta">
            <span id="datasetStatus">正在加载字形数据…</span>
            <span aria-hidden="true">·</span>
            <span id="version"></span>
          </p>
        </div>

        <div class="search-bar">
          <md-outlined-text-field
            id="queryInput"
            class="han query-input"
            label="输入部件"
            autocomplete="off"
            spellcheck="false"></md-outlined-text-field>
          <md-filled-tonal-button id="clearButton" title="清除查询">清</md-filled-tonal-button>
          <md-filled-tonal-button id="decomposeButton" title="拆分光标前的字">拆</md-filled-tonal-button>
          <md-filled-tonal-button id="searchButton" title="搜索全部指定区块">查</md-filled-tonal-button>
        </div>

        <p class="syntax-help">
          输入一个或多个部件进行检索；<code>-</code> 后可排除字符；以 <code>:</code>
          开头查看单字拆分。点击区块按钮可限定检索范围。
        </p>
      </section>

      <section class="seeker-panel options-panel" aria-label="检索选项">
        <label class="option-item">
          <span>包含异体</span>
          <md-switch id="variantSwitch"></md-switch>
        </label>
        <label class="option-item">
          <span>强行拆分</span>
          <md-switch id="subdivideSwitch"></md-switch>
        </label>
        <label class="option-item">
          <span>仅 8105</span>
          <md-switch id="standardOnlySwitch"></md-switch>
        </label>
        <label class="option-item">
          <span>部件键盘</span>
          <md-switch id="keypadSwitch"></md-switch>
        </label>
      </section>

      <section id="shortcutPanel" class="seeker-panel shortcut-panel" hidden>
        <div class="panel-heading-row"><h2>收藏栏</h2></div>
        <div id="shortcutBar" class="shortcut-bar han"></div>
      </section>

      <section id="keyboardPanel" class="seeker-panel keyboard-panel" hidden>
        <div class="panel-heading-row">
          <h2>部件键盘</h2>
        </div>
        <div id="keypad" class="keypad han"></div>
      </section>

      <section class="seeker-panel result-panel" aria-labelledby="resultHeading">
        <div class="result-header">
          <div>
            <h2 id="resultHeading">检索结果</h2>
            <output id="searchStatus" class="search-status" aria-live="polite"></output>
          </div>
          <div id="blockLegend" class="block-legend" aria-label="Unicode 区块"></div>
        </div>
        <div id="treeResult" class="tree-result han" hidden></div>
        <div id="resultSections" class="result-sections"></div>
      </section>

      <aside id="charMenu" class="char-menu" hidden>
        <div id="charMenuMotion" class="char-menu-motion">
          <div id="charMenuSurface" class="char-menu-surface">
            <div class="char-preview">
              <span id="menuChar" class="char-preview-glyph han"></span>
              <span id="menuCode" class="char-preview-code"></span>
            </div>
            <div class="char-actions">
              <button type="button" data-action="insert">输入</button>
              <button type="button" data-action="query">替换查找</button>
              <button type="button" data-action="copy">复制此字</button>
              <button type="button" data-action="exclude">排除此字</button>
              <button type="button" data-action="favorite">加入收藏栏</button>
              <a id="menuExternal" target="_blank" rel="noopener noreferrer">外部查字</a>
            </div>
          </div>
        </div>
      </aside>

      <div id="copyToast" class="copy-toast" role="status" aria-live="polite" hidden>
        <span id="copyToastChar" class="han"></span>
        <span>已复制</span>
      </div>
    </div>
  </body>
</html>
